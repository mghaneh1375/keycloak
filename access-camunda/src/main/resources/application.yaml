spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/access-management

  datasource:
    url: jdbc:mysql://localhost:3306/camunda
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-init-sql: SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8082

camunda:
  client:
    mode: self-managed

    auth:
      enabled: false

    zeebe:
      enabled: true
      grpc-address: http://localhost:26500

debug: true