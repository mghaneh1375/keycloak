server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/keycloak
    username: keycloak
    password: keycloak
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

publisher:
  fixed-delay: 5000